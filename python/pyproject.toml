[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vekquorum"
version = "1.0.0.dev1"
description = "VekQuorum — M-of-N Ed25519 approval over RFC8785-bound action bytes, consume-once commit, vq.visreceipt/1 proof export (protocol vq/1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vq = "vekquorum.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vekquorum*"]

[tool.setuptools.package-data]
vekquorum = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["../tests/conformance"]
